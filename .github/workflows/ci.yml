name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least-privilege default: this workflow only ever reads repository contents
# (its own repo, plus the read-only sibling checkout of `iam3xtr/ui` below —
# never a write scope). `packages:write` is never requested here; it is
# granted exclusively to release.yml's `release` job for a tag push.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: vue

      # package.json's devDependency on @iam3xtr/ui is "file:../ui" — the
      # same submodule-sibling layout the UI Kit uses in packages/. A
      # standalone clone of this repo has no such sibling, so CI recreates
      # it — pinned to the exact commit recorded in .ui-compat-ref (updated
      # in the same PR that bumps peerDependencies["@iam3xtr/ui"]), not
      # iam3xtr/ui's moving default branch, so re-running these checks later
      # always tests the same verified pair. iam3xtr/ui is public, so this
      # checkout intentionally needs no extra secret.
      - name: Read pinned @iam3xtr/ui ref
        id: ui-ref
        run: echo "sha=$(cat vue/.ui-compat-ref)" >> "$GITHUB_OUTPUT"

      - name: "Checkout sibling @iam3xtr/ui (devDependency: file:../ui)"
        uses: actions/checkout@v6
        with:
          repository: iam3xtr/ui
          ref: ${{ steps.ui-ref.outputs.sha }}
          path: ui

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            vue/package-lock.json
            ui/package-lock.json

      # The pinned sibling is a source checkout. Its public `./icons` entry
      # targets generated dist/icons.js, so build it before npm resolves the
      # `file:../ui` devDependency used by Vue's component/export tests.
      - name: Install and build pinned @iam3xtr/ui
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: vue
        run: npm ci

      - name: Test (component/a11y/SSR/export/peer/pack contract)
        working-directory: vue
        run: npm test

      - name: Inspect pack contents
        working-directory: vue
        run: npm pack --dry-run
